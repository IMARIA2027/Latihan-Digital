<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan IMARIA Nasional 2027 - Kategori F - Ekstra</title>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Merriweather Sans', sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            color: #000;
        }
        .header-container {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            background: #ffffff;
            padding: 10px 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 15px;
            border: 1px solid #ccc;
        }
        .title {
            font-weight: bold;
            font-size: 16px;
        }
        .controls button {
            font-family: 'Merriweather Sans', sans-serif;
            padding: 6px 12px;
            margin-right: 5px;
            margin-bottom: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .controls button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .btn-online { background-color: #d4edda; color: #155724; }
        .btn-finish { background-color: #cce5ff; color: #004085; }
        .btn-reset { background-color: #f8d7da; color: #721c24; }
        
        .timer {
            color: #dc3545;
            font-weight: bold;
        }
        .score-box {
            border: 2px solid #000;
            padding: 5px 15px;
            border-radius: 5px;
            font-weight: bold;
            background: #fff;
        }

        .table-section {
            background: #fff;
            margin-bottom: 15px;
            border: 1px solid #999;
            overflow-x: auto;
        }

        .bottom-sections-wrapper {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        .bottom-section {
            flex: 1;
            min-width: 300px;
            background: #fff;
            margin-bottom: 15px;
            border: 1px solid #999;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            table-layout: fixed;
        }
        th, td {
            border: 1px solid #999;
            padding: 4px 3px;
            font-size: 14px;
        }
        th.col-no, td.col-no {
            width: 45px;
            min-width: 45px;
            max-width: 45px;
        }
        th {
            background-color: #e2e2e2;
            font-size: 11px;
            font-style: italic;
            font-weight: normal;
        }
        
        .ans-cell-container {
            display: flex;
            align-items: center;
            background: #fff;
            border: 1px solid #aaa;
            border-radius: 3px;
            padding: 1px 3px;
            width: 82%;
            margin: 0 auto;
        }

        .ans-currency {
            font-size: 12px;
            font-weight: bold;
            font-style: italic;
            color: #222;
            margin-right: 2px;
            user-select: none;
        }

        .ans-input {
            font-family: 'Merriweather Sans', sans-serif;
            width: 100%;
            border: none;
            outline: none;
            background: transparent;
            text-align: center;
            font-size: 13px;
            padding: 0;
        }

        .number-row td:not(.col-no) {
            position: relative; 
            font-family: 'Merriweather Sans', sans-serif;
            font-size: 13px;
            font-weight: 600;
            font-style: italic; 
            height: 22px;
            padding-right: 15px;
            text-align: right;
        }
        
        .currency-symbol {
            position: absolute;
            left: 6px;
        }

        .correct-box { background-color: #d4edda !important; border-color: #28a745 !important; }
        .incorrect-box { background-color: #f8d7da !important; border-color: #dc3545 !important; }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #fff;
            padding: 25px 30px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            width: 260px;
            border: 1px solid #ccc;
        }
        .modal-content h3 {
            margin-top: 0;
            margin-bottom: 20px;
            color: #dc3545;
            font-size: 20px;
        }
        .modal-btn {
            background-color: #004085;
            color: white;
            border: none;
            padding: 8px 25px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Merriweather Sans', sans-serif;
        }
        .modal-btn:hover {
            background-color: #002752;
        }
    </style>
</head>
<body>

    <div class="modal-overlay" id="timeUpModal">
        <div class="modal-content">
            <h3>Waktu Habis</h3>
            <button class="modal-btn" onclick="closeModal()">OK</button>
        </div>
    </div>

    <div class="header-container">
        <div>
            <span class="title">Latihan IMARIA Nasional 2027</span>
            <div style="font-size: 13px; margin-top: 5px;" class="controls">
                Tambah Kurang (Nilai @10) & Kali/Bagi (Nilai @5) &nbsp;|&nbsp; 
                <button id="startBtn" class="btn-online" onclick="startTest()">Mulai Mengerjakan</button>
                <button class="btn-finish" onclick="finishTest()">Selesai</button>
                <button class="btn-reset" onclick="resetTest()">Atur Ulang</button>
                <span class="timer" id="timerDisplay">Siap mengerjakan 01:00</span>
            </div>
        </div>
        <div>
            <span style="font-weight: bold; font-size: 15px;">Kategori F - Ekstra</span>
            <div style="font-size: 12px; margin-top: 4px;">Batas waktu: 1 menit</div>
        </div>
        <div class="score-box">
            NILAI <span id="finalScore">0</span>
        </div>
    </div>

    <div class="table-section">
        <div style="background-color: #e2e2e2; padding: 6px; font-size: 13px; font-weight: bold; text-align: center; border-bottom: 1px solid #999;">TAMBAH KURANG</div>
        <table id="gridTambahKurang"></table>
    </div>

    <div class="bottom-sections-wrapper">
        <div class="bottom-section">
            <div style="background-color: #e2e2e2; padding: 6px; font-size: 13px; font-weight: bold; text-align: center; border-bottom: 1px solid #999;">PERKALIAN</div>
            <table id="gridMultiply"></table>
        </div>
        <div class="bottom-section">
            <div style="background-color: #e2e2e2; padding: 6px; font-size: 13px; font-weight: bold; text-align: center; border-bottom: 1px solid #999;">PEMBAGIAN</div>
            <table id="gridDivide"></table>
        </div>
    </div>

    <script>
        let tkQuestions = [];
        let multiplyQuestions = [];
        let divideQuestions = [];
        let timerInterval;
        let timeLeft = 60;
        let isTestActive = false;

        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function formatNumberWithDot(num) {
            return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
        }

        function formatExactTkAnswer(totalVal) {
            let intPart = Math.floor(totalVal / 100);
            let decPart = totalVal % 100;
            let decStr = String(decPart).padStart(2, '0');
            let formattedInt = intPart.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
            return `${formattedInt},${decStr}`;
        }

        function generateTkQuestionData(colIndex) {
            let valid = false;
            let rowsResult = [];
            let currentTotal = 0;
            let noMinusCols = [1, 3, 5, 6, 8, 10];
            let allowMinus = !noMinusCols.includes(colIndex);

            while (!valid) {
                let rowTypes = [
                    'puluhan', 'puluhan', 'puluhan',
                    'satuan', 'satuan', 'satuan', 'satuan',
                    'persepuluhan', 'persepuluhan', 'persepuluhan'
                ];
                rowTypes.sort(() => Math.random() - 0.5);

                let digitPool = [];
                for (let d = 1; d <= 9; d++) {
                    for (let k = 0; k < 3; k++) digitPool.push(d);
                }
                for (let k = 0; k < 3; k++) digitPool.push(0);
                digitPool.sort(() => Math.random() - 0.5);

                let tempPool = [...digitPool];
                let generatedRows = [];
                let runningTotal = 0;
                let sequenceValid = true;

                let minusIndices = [];
                if (allowMinus) {
                    let puluhanIndices = [];
                    let satuanIndices = [];
                    let persepuluhanIndices = [];

                    rowTypes.forEach((type, idx) => {
                        if (idx > 0) {
                            if (type === 'puluhan') puluhanIndices.push(idx);
                            else if (type === 'satuan') satuanIndices.push(idx);
                            else if (type === 'persepuluhan') persepuluhanIndices.push(idx);
                        }
                    });

                    puluhanIndices.sort(() => Math.random() - 0.5);
                    satuanIndices.sort(() => Math.random() - 0.5);
                    persepuluhanIndices.sort(() => Math.random() - 0.5);

                    minusIndices = [
                        puluhanIndices[0],
                        satuanIndices[0],
                        persepuluhanIndices[0]
                    ].filter(val => val !== undefined);
                }

                for (let r = 0; r < 10; r++) {
                    let type = rowTypes[r];
                    let intStr = "";
                    let decStr = "";

                    if (type === 'puluhan') {
                        let d1 = tempPool.pop();
                        let d2 = tempPool.pop();
                        if (d1 === 0) {
                            let nonZeroIdx = tempPool.findIndex(d => d !== 0);
                            if (nonZeroIdx !== -1) {
                                tempPool.push(d1);
                                d1 = tempPool.splice(nonZeroIdx, 1)[0];
                            } else {
                                d1 = 1;
                            }
                        }
                        intStr = `${d1}${d2}`;
                    } else if (type === 'satuan') {
                        let d1 = tempPool.pop();
                        if (d1 === 0) {
                            let nonZeroIdx = tempPool.findIndex(d => d !== 0);
                            if (nonZeroIdx !== -1) {
                                tempPool.push(d1);
                                d1 = tempPool.splice(nonZeroIdx, 1)[0];
                            } else {
                                d1 = 1;
                            }
                        }
                        intStr = `${d1}`;
                    } else if (type === 'persepuluhan') {
                        intStr = `0`;
                    }

                    let dc1 = tempPool.pop();
                    let dc2 = tempPool.pop();

                    if (type === 'persepuluhan') {
                        if (dc1 === 0) {
                            let nonZeroIdx = tempPool.findIndex(d => d !== 0);
                            if (nonZeroIdx !== -1) {
                                tempPool.push(dc1);
                                dc1 = tempPool.splice(nonZeroIdx, 1)[0];
                            } else {
                                dc1 = 1;
                            }
                        }
                    } else {
                        if (dc1 === 0 && dc2 === 0) {
                            let nonZeroIdx = tempPool.findIndex(d => d !== 0);
                            if (nonZeroIdx !== -1) {
                                tempPool.push(dc1);
                                dc1 = tempPool.splice(nonZeroIdx, 1)[0];
                            } else {
                                dc1 = 1;
                            }
                        }
                    }

                    decStr = `${dc1}${dc2}`;

                    let intVal = parseInt(intStr, 10);
                    let decVal = parseInt(decStr, 10);
                    let totalVal = intVal * 100 + decVal;
                    let displayStr = `${intStr},${decStr}`;

                    let isMinus = minusIndices.includes(r);

                    if (r === 0) {
                        runningTotal += totalVal;
                        generatedRows.push({ display: displayStr, val: totalVal, isFirst: true });
                    } else {
                        if (isMinus) {
                            if (runningTotal >= totalVal) {
                                runningTotal -= totalVal;
                                generatedRows.push({ display: `- ${displayStr}`, val: -totalVal, isFirst: false });
                            } else {
                                sequenceValid = false;
                                break;
                            }
                        } else {
                            runningTotal += totalVal;
                            generatedRows.push({ display: displayStr, val: totalVal, isFirst: false });
                        }
                    }
                }

                if (sequenceValid && runningTotal >= 0) {
                    currentTotal = runningTotal;
                    rowsResult = generatedRows;
                    valid = true;
                }
            }

            return { rows: rowsResult, answer: currentTotal, exactStr: formatExactTkAnswer(currentTotal) };
        }

        function generateQuestions() {
            tkQuestions = [];
            for (let i = 1; i <= 10; i++) {
                let qData = generateTkQuestionData(i);
                tkQuestions.push({
                    id: i,
                    rowCount: 10,
                    rows: qData.rows,
                    answer: qData.answer,
                    exactStr: qData.exactStr
                });
            }

            let validMult = false;
            let multResult = [];

            while (!validMult) {
                let digitPool = [];
                for (let d = 0; d <= 9; d++) {
                    for (let k = 0; k < 5; k++) digitPool.push(d);
                }
                digitPool.sort(() => Math.random() - 0.5);
                let poolCopy = [...digitPool];
                let tempMult = [];
                let success = true;

                for (let i = 1; i <= 10; i++) {
                    let isHundredTimesTen = (i % 2 !== 0);
                    let h1, h2, h3, t1, t2;

                    if (isHundredTimesTen) {
                        h1 = poolCopy.splice(poolCopy.findIndex(d => d !== 0), 1)[0];
                        h2 = poolCopy.pop();
                        h3 = poolCopy.pop();
                        t1 = poolCopy.splice(poolCopy.findIndex(d => d !== 0), 1)[0];
                        t2 = poolCopy.splice(poolCopy.findIndex(d => d !== 0), 1)[0];
                    } else {
                        t1 = poolCopy.splice(poolCopy.findIndex(d => d !== 0), 1)[0];
                        t2 = poolCopy.splice(poolCopy.findIndex(d => d !== 0), 1)[0];
                        h1 = poolCopy.splice(poolCopy.findIndex(d => d !== 0), 1)[0];
                        h2 = poolCopy.pop();
                        h3 = poolCopy.pop();
                    }

                    let a = isHundredTimesTen ? (h1 * 100 + h2 * 10 + h3) : (t1 * 10 + t2);
                    let b = isHundredTimesTen ? (t1 * 10 + t2) : (h1 * 100 + h2 * 10 + h3);

                    if (a % 100 === 0 || b % 100 === 0) {
                        success = false;
                        break;
                    }

                    let ansVal = a * b;
                    let exact = formatNumberWithDot(ansVal);
                    tempMult.push({
                        id: i,
                        display: `${formatNumberWithDot(a)} × ${formatNumberWithDot(b)}`,
                        answer: ansVal,
                        exactStr: exact
                    });
                }

                if (success) {
                    multiplyQuestions = tempMult;
                    validMult = true;
                }
            }

            divideQuestions = [];
            let divList = [];

            // 2 soal angka yg dibagi ratusan, hasil 2 digit bulat (11 s.d. 99, bukan kelipatan 10 pas)
            for (let i = 0; i < 2; i++) {
                let validDiv = false;
                let divisor, quotient, dividend;
                while (!validDiv) {
                    quotient = getRandomInt(11, 99);
                    if (quotient % 10 === 0) continue; // Pastikan bukan 20, 30, dst.
                    
                    divisor = getRandomInt(11, 99);
                    if (divisor % 10 === 0) continue;

                    dividend = divisor * quotient;

                    if (dividend >= 100 && dividend <= 999) {
                        validDiv = true;
                    }
                }
                let exact = formatNumberWithDot(quotient);
                divList.push({
                    display: `${formatNumberWithDot(dividend)} ÷ ${formatNumberWithDot(divisor)}`,
                    answer: quotient,
                    exactStr: exact
                });
            }

            // 8 soal angka yg dibagi ribuan, hasil 2 digit bulat (11 s.d. 99, bukan kelipatan 10 pas)
            for (let i = 0; i < 8; i++) {
                let validDiv = false;
                let divisor, quotient, dividend;
                while (!validDiv) {
                    quotient = getRandomInt(11, 99);
                    if (quotient % 10 === 0) continue; // Pastikan bukan 20, 30, dst.

                    divisor = getRandomInt(11, 99);
                    if (divisor % 10 === 0) continue;

                    dividend = divisor * quotient;

                    if (dividend >= 1000 && dividend <= 9999) {
                        validDiv = true;
                    }
                }
                let exact = formatNumberWithDot(quotient);
                divList.push({
                    display: `${formatNumberWithDot(dividend)} ÷ ${formatNumberWithDot(divisor)}`,
                    answer: quotient,
                    exactStr: exact
                });
            }

            divList.sort(() => Math.random() - 0.5);

            for (let i = 0; i < 10; i++) {
                divideQuestions.push({
                    id: i + 1,
                    display: divList[i].display,
                    answer: divList[i].answer,
                    exactStr: divList[i].exactStr
                });
            }
        }

        function renderTkTable(active) {
            let table = document.getElementById('gridTambahKurang');
            if (!table) return;
            let html = '<thead><tr><th class="col-no">NO</th>';
            for (let i = 1; i <= 10; i++) {
                html += `<th>${i}</th>`;
            }
            html += '</tr></thead><tbody>';

            for (let r = 0; r < 10; r++) {
                html += `<tr class="number-row"><td class="col-no" style="text-align: center; padding-right: 0; font-weight: normal; font-style: normal; font-size: 11px; background-color: #f8f9fa;">${r+1}</td>`;
                for (let i = 0; i < 10; i++) {
                    let cellData = (active && tkQuestions[i] && tkQuestions[i].rows[r]) ? tkQuestions[i].rows[r] : null;
                    if (cellData) {
                        if (cellData.isFirst) {
                            html += `<td><span class="currency-symbol">$</span>${cellData.display}</td>`;
                        } else {
                            html += `<td>${cellData.display}</td>`;
                        }
                    } else {
                        html += `<td></td>`;
                    }
                }
                html += '</tr>';
            }

            html += '<tr><td class="col-no" style="text-align: center; font-weight: bold; font-size: 11px; font-style: normal; background-color: #f8f9fa;">Jawaban</td>';
            for (let i = 1; i <= 10; i++) {
                let disabledAttr = active ? '' : 'disabled';
                let placeholderText = active ? '' : '-';
                html += `<td>
                            <div class="ans-cell-container" id="container-tk-${i}">
                                <span class="ans-currency">$</span>
                                <input type="text" class="ans-input" id="ans-tk-${i}" data-qid="${i}" ${disabledAttr} placeholder="${placeholderText}" onkeydown="handleEnter(event, 'tk', ${i})">
                            </div>
                       </td>`;
            }
            html += '</tr></tbody>';
            table.innerHTML = html;
        }

        function renderTableSection(questionsList, elementId, active, titlePrefix) {
            let table = document.getElementById(elementId);
            if (!table) return;
            let html = '<thead><tr><th class="col-no">NO</th><th>SOAL</th><th style="width: 130px;">JAWABAN</th></tr></thead><tbody>';

            for (let i = 0; i < questionsList.length; i++) {
                let q = questionsList[i];
                let qid = q.id;
                let disabledAttr = active ? '' : 'disabled';
                let placeholderText = active ? '' : '-';
                let displayVal = active ? q.display : '...';

                html += `<tr class="number-row" style="height: 28px;">
                    <td class="col-no" style="text-align: center; font-weight: normal; font-style: normal; font-size: 11px; background-color: #f8f9fa; padding-right:0;">${qid}</td>
                    <td style="text-align: center; padding-right:0;">${displayVal}</td>
                    <td>
                        <div class="ans-cell-container" id="container-${titlePrefix}-${qid}" style="width: 90%;">
                            <input type="text" class="ans-input" id="ans-${titlePrefix}-${qid}" data-qid="${qid}" ${disabledAttr} placeholder="${placeholderText}" onkeydown="handleEnter(event, '${titlePrefix}', ${qid})">
                        </div>
                    </td>
                </tr>`;
            }
            html += '</tbody>';
            table.innerHTML = html;
        }

        function renderTables(active) {
            renderTkTable(active);
            renderTableSection(multiplyQuestions, 'gridMultiply', active, 'm');
            renderTableSection(divideQuestions, 'gridDivide', active, 'd');
        }

        function handleEnter(event, prefix, currentQid) {
            if (event.key === 'Enter') {
                event.preventDefault();
                let nextQid = currentQid + 1;
                let nextInput = document.getElementById(`ans-${prefix}-${nextQid}`);
                if (nextInput) {
                    nextInput.focus();
                    nextInput.select();
                } else if (prefix === 'tk') {
                    let firstMult = document.getElementById('ans-m-1');
                    if (firstMult) { firstMult.focus(); firstMult.select(); }
                } else if (prefix === 'm') {
                    let firstDiv = document.getElementById('ans-d-1');
                    if (firstDiv) { firstDiv.focus(); firstDiv.select(); }
                } else if (prefix === 'd' && currentQid === 10) {
                    finishTest();
                }
            }
        }

        function startTest() {
            clearInterval(timerInterval);
            timeLeft = 60;
            isTestActive = true;
            document.getElementById('startBtn').disabled = true;
            generateQuestions();
            renderTables(true);
            
            let firstInput = document.getElementById('ans-tk-1');
            if (firstInput) firstInput.focus();
            
            timerInterval = setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    let minutes = String(Math.floor(timeLeft / 60)).padStart(2, '0');
                    let seconds = String(timeLeft % 60).padStart(2, '0');
                    document.getElementById('timerDisplay').innerText = `Sedang mengerjakan ${minutes}:${seconds}`;
                } else {
                    clearInterval(timerInterval);
                    isTestActive = false;
                    checkScoring();
                    document.getElementById('timerDisplay').innerText = "Waktu Habis";
                    document.getElementById('timeUpModal').style.display = 'flex';
                }
            }, 1000);
        }

        function closeModal() {
            document.getElementById('timeUpModal').style.display = 'none';
        }

        function finishTest() {
            if (!isTestActive) return;
            clearInterval(timerInterval);
            isTestActive = false;
            document.getElementById('timerDisplay').innerText = "Selesai";
            checkScoring();
        }

        function checkScoring() {
            let score = 0;
            
            tkQuestions.forEach(q => {
                let inputElem = document.getElementById(`ans-tk-${q.id}`);
                let containerElem = document.getElementById(`container-tk-${q.id}`);
                if (!inputElem || !containerElem) return;
                
                inputElem.disabled = true;
                let userVal = inputElem.value.trim();
                containerElem.classList.remove('correct-box', 'incorrect-box');

                if (userVal === "") return;

                if (userVal === q.exactStr) {
                    score += 10;
                    containerElem.classList.add('correct-box');
                } else {
                    containerElem.classList.add('incorrect-box');
                }
            });

            multiplyQuestions.forEach(q => {
                let inputElem = document.getElementById(`ans-m-${q.id}`);
                let containerElem = document.getElementById(`container-m-${q.id}`);
                if (!inputElem || !containerElem) return;
                
                inputElem.disabled = true;
                let userVal = inputElem.value.trim();
                containerElem.classList.remove('correct-box', 'incorrect-box');

                if (userVal === "") return;

                if (userVal === q.exactStr) {
                    score += 5;
                    containerElem.classList.add('correct-box');
                } else {
                    containerElem.classList.add('incorrect-box');
                }
            });

            divideQuestions.forEach(q => {
                let inputElem = document.getElementById(`ans-d-${q.id}`);
                let containerElem = document.getElementById(`container-d-${q.id}`);
                if (!inputElem || !containerElem) return;
                
                inputElem.disabled = true;
                let userVal = inputElem.value.trim();
                containerElem.classList.remove('correct-box', 'incorrect-box');

                if (userVal === "") return;

                if (userVal === q.exactStr) {
                    score += 5;
                    containerElem.classList.add('correct-box');
                } else {
                    containerElem.classList.add('incorrect-box');
                }
            });

            document.getElementById('finalScore').innerText = score;
        }

        function resetTest() {
            clearInterval(timerInterval);
            isTestActive = false;
            document.getElementById('startBtn').disabled = false;
            document.getElementById('timeUpModal').style.display = 'none';
