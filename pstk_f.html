<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan IMARIA Nasional 2027 - Kategori F - PS Tambah Kurang</title>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Merriweather Sans', sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            color: #000;
        }
        .header-container {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            background: #ffffff;
            padding: 10px 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 15px;
            border: 1px solid #ccc;
        }
        .title {
            font-weight: bold;
            font-size: 16px;
        }
        .controls button {
            font-family: 'Merriweather Sans', sans-serif;
            padding: 6px 12px;
            margin-right: 5px;
            margin-bottom: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .controls button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .btn-online { background-color: #d4edda; color: #155724; }
        .btn-finish { background-color: #cce5ff; color: #004085; }
        .btn-reset { background-color: #f8d7da; color: #721c24; }
        
        .timer {
            color: #dc3545;
            font-weight: bold;
        }
        .score-box {
            border: 2px solid #000;
            padding: 5px 15px;
            border-radius: 5px;
            font-weight: bold;
            background: #fff;
        }

        .table-section {
            background: #fff;
            margin-bottom: 15px;
            border: 1px solid #999;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            table-layout: fixed;
        }
        th, td {
            border: 1px solid #999;
            padding: 4px 3px;
            font-size: 14px;
        }
        th.col-no, td.col-no {
            width: 45px;
            min-width: 45px;
            max-width: 45px;
        }
        th {
            background-color: #e2e2e2;
            font-size: 11px;
            font-style: italic;
            font-weight: normal;
        }
        
        .ans-cell-container {
            display: flex;
            align-items: center;
            background: #fff;
            border: 1px solid #aaa;
            border-radius: 3px;
            padding: 1px 3px;
            width: 82%;
            margin: 0 auto;
        }

        .ans-currency {
            font-size: 12px;
            font-weight: bold;
            font-style: italic;
            color: #222;
            margin-right: 2px;
            user-select: none;
        }

        .ans-input {
            font-family: 'Merriweather Sans', sans-serif;
            width: 100%;
            border: none;
            outline: none;
            background: transparent;
            text-align: center;
            font-size: 13px;
            padding: 0;
        }

        .number-row td:not(.col-no) {
            position: relative; 
            font-family: 'Merriweather Sans', sans-serif;
            font-size: 13px;
            font-weight: 600;
            font-style: italic; 
            height: 22px;
            padding-right: 15px;
            text-align: right;
        }
        
        .currency-symbol {
            position: absolute;
            left: 6px;
        }

        .correct-box { background-color: #d4edda !important; border-color: #28a745 !important; }
        .incorrect-box { background-color: #f8d7da !important; border-color: #dc3545 !important; }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #fff;
            padding: 25px 30px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            width: 260px;
            border: 1px solid #ccc;
        }
        .modal-content h3 {
            margin-top: 0;
            margin-bottom: 20px;
            color: #dc3545;
            font-size: 20px;
        }
        .modal-btn {
            background-color: #004085;
            color: white;
            border: none;
            padding: 8px 25px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Merriweather Sans', sans-serif;
        }
        .modal-btn:hover {
            background-color: #002752;
        }
    </style>
</head>
<body>

    <div class="modal-overlay" id="timeUpModal">
        <div class="modal-content">
            <h3>Waktu Habis</h3>
            <button class="modal-btn" onclick="closeModal()">OK</button>
        </div>
    </div>

    <div class="header-container">
        <div>
            <span class="title">Latihan IMARIA Nasional 2027</span>
            <div style="font-size: 13px; margin-top: 5px;" class="controls">
                20 Soal masing-masing 10 baris &nbsp;|&nbsp;  
                <button id="startBtn" class="btn-online" onclick="startTest()">Mulai Mengerjakan</button>
                <button class="btn-finish" onclick="finishTest()">Selesai</button>
                <button class="btn-reset" onclick="resetTest()">Atur Ulang</button>
                <span class="timer" id="timerDisplay">Siap mengerjakan 03:00</span>
            </div>
        </div>
        <div>
            <span style="font-weight: bold; font-size: 15px;">Kategori F - PS Tambah Kurang</span>
            <div style="font-size: 12px; margin-top: 4px;">Batas waktu: 3 menit</div>
        </div>
        <div class="score-box">
            NILAI <span id="finalScore">0</span>
        </div>
    </div>

    <div class="table-section">
        <table id="gridPart1"></table>
    </div>

    <div class="table-section">
        <table id="gridPart2"></table>
    </div>

    <script>
        let questions = [];
        let timerInterval;
        let timeLeft = 180;
        let isTestActive = false;

        function formatExactTkAnswer(totalVal) {
            let intPart = Math.floor(totalVal / 100);
            let decPart = totalVal % 100;
            let decStr = String(decPart).padStart(2, '0');
            let formattedInt = intPart.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
            return `${formattedInt},${decStr}`;
        }

        function generateQuestions() {
            questions = [];
            
            let mandatoryMinusNos = [2, 4, 7, 9, 12, 14, 17, 19];

            for (let i = 1; i <= 20; i++) {
                let valid = false;
                let rowsResult = [];
                let currentTotal = 0;
                let isMinusQuestion = mandatoryMinusNos.includes(i);

                while (!valid) {
                    let rowTypes = [
                        'puluhan', 'puluhan', 'puluhan',
                        'satuan', 'satuan', 'satuan', 'satuan',
                        'persepuluhan', 'persepuluhan', 'persepuluhan'
                    ];
                    rowTypes.sort(() => Math.random() - 0.5);

                    let digitPool = [];
                    for (let d = 1; d <= 9; d++) {
                        for (let k = 0; k < 3; k++) digitPool.push(d);
                    }
                    for (let k = 0; k < 3; k++) digitPool.push(0);
                    digitPool.sort(() => Math.random() - 0.5);

                    let tempPool = [...digitPool];
                    let generatedRows = [];
                    let runningTotal = 0;
                    let sequenceValid = true;

                    let minusIndices = [];
                    if (isMinusQuestion) {
                        let puluhanIndices = [];
                        let satuanIndices = [];
                        let persepuluhanIndices = [];

                        rowTypes.forEach((type, idx) => {
                            if (idx > 0) {
                                if (type === 'puluhan') puluhanIndices.push(idx);
                                else if (type === 'satuan') satuanIndices.push(idx);
                                else if (type === 'persepuluhan') persepuluhanIndices.push(idx);
                            }
                        });

                        puluhanIndices.sort(() => Math.random() - 0.5);
                        satuanIndices.sort(() => Math.random() - 0.5);
                        persepuluhanIndices.sort(() => Math.random() - 0.5);

                        if (persepuluhanIndices.length > 0) minusIndices.push(persepuluhanIndices[0]);
                        if (satuanIndices.length > 0) minusIndices.push(satuanIndices[0]);
                        if (puluhanIndices.length > 0) minusIndices.push(puluhanIndices[0]);
                    }

                    for (let r = 0; r < 10; r++) {
                        let type = rowTypes[r];
                        let intStr = "";
                        let decStr = "";

                        if (type === 'puluhan') {
                            let d1 = tempPool.pop();
                            let d2 = tempPool.pop();
                            if (d1 === 0) {
                                let nonZeroIdx = tempPool.findIndex(d => d !== 0);
                                if (nonZeroIdx !== -1) {
                                    tempPool.push(d1);
                                    d1 = tempPool.splice(nonZeroIdx, 1)[0];
                                } else {
                                    d1 = 1;
                                }
                            }
                            intStr = `${d1}${d2}`;
                        } else if (type === 'satuan') {
                            let d1 = tempPool.pop();
                            if (d1 === 0) {
                                let nonZeroIdx = tempPool.findIndex(d => d !== 0);
                                if (nonZeroIdx !== -1) {
                                    tempPool.push(d1);
                                    d1 = tempPool.splice(nonZeroIdx, 1)[0];
                                } else {
                                    d1 = 1;
                                }
                            }
                            intStr = `${d1}`;
                        } else if (type === 'persepuluhan') {
                            intStr = `0`;
                        }

                        let dc1 = tempPool.pop();
                        let dc2 = tempPool.pop();

                        if (type === 'persepuluhan') {
                            // Mencegah format 0,0X (artinya dc1 harus tidak boleh 0, atau jika 0 maka dc2 juga tidak boleh 0 / harus diubah)
                            if (dc1 === 0) {
                                let nonZeroIdx = tempPool.findIndex(d => d !== 0);
                                if (nonZeroIdx !== -1) {
                                    tempPool.push(dc1);
                                    dc1 = tempPool.splice(nonZeroIdx, 1)[0];
                                } else {
                                    dc1 = 1; // Paksa jadi minimal 1 jika tidak ada angka lain di pool
                                }
                            }
                        } else {
                            if (type === 'persepuluhan' && dc1 === 0 && dc2 === 0) {
                                let nonZeroIdx = tempPool.findIndex(d => d !== 0);
                                if (nonZeroIdx !== -1) {
                                    tempPool.push(dc1);
                                    dc1 = tempPool.splice(nonZeroIdx, 1)[0];
                                } else {
                                    dc1 = 1;
                                }
                            }
                        }

                        decStr = `${dc1}${dc2}`;

                        let intVal = parseInt(intStr, 10);
                        let decVal = parseInt(decStr, 10);
                        let totalVal = intVal * 100 + decVal;
                        let displayStr = `${intStr},${decStr}`;

                        let isMinus = (r !== 0 && minusIndices.includes(r));

                        if (r === 0) {
                            runningTotal += totalVal;
                            generatedRows.push({ display: displayStr, val: totalVal, isFirst: true });
                        } else {
                            if (isMinus) {
                                if (runningTotal >= totalVal) {
                                    runningTotal -= totalVal;
                                    generatedRows.push({ display: `- ${displayStr}`, val: -totalVal, isFirst: false });
                                } else {
                                    sequenceValid = false;
                                    break;
                                }
                            } else {
                                runningTotal += totalVal;
                                generatedRows.push({ display: displayStr, val: totalVal, isFirst: false });
                            }
                        }
                    }

                    if (sequenceValid && runningTotal >= 0) {
                        currentTotal = runningTotal;
                        rowsResult = generatedRows;
                        valid = true;
                    }
                }

                questions.push({
                    id: i,
                    rows: rowsResult,
                    answer: currentTotal,
                    exactStr: formatExactTkAnswer(currentTotal)
                });
            }
        }

        function renderTablePart(start, end, rowCount, elementId, active) {
            let table = document.getElementById(elementId);
            if (!table) return;
            let html = '<thead><tr><th class="col-no">NO</th>';
            
            for (let i = start; i <= end; i++) {
                html += `<th>${i}</th>`;
            }
            html += '</tr></thead><tbody>';

            for (let r = 0; r < rowCount; r++) {
                html += `<tr class="number-row"><td class="col-no" style="text-align: center; padding-right: 0; font-weight: normal; font-style: normal; font-size: 11px; background-color: #f8f9fa;">${r+1}</td>`;
                for (let i = start - 1; i < end; i++) {
                    let cellData = (active && questions[i] && questions[i].rows[r]) ? questions[i].rows[r] : null;
                    if (cellData) {
                        if (cellData.isFirst) {
                            html += `<td><span class="currency-symbol">$</span>${cellData.display}</td>`;
                        } else {
                            html += `<td>${cellData.display}</td>`;
                        }
                    } else {
                        html += `<td></td>`;
                    }
                }
                html += '</tr>';
            }

            html += '<tr><td class="col-no" style="text-align: center; font-weight: bold; font-size: 11px; font-style: normal; background-color: #f8f9fa;">Jawaban</td>';
            for (let i = start; i <= end; i++) {
                let disabledAttr = active ? '' : 'disabled';
                let placeholderText = active ? '' : '-';
                html += `<td>
                            <div class="ans-cell-container" id="container-${i}">
                                <span class="ans-currency">$</span>
                                <input type="text" inputmode="numeric" class="ans-input" id="ans-${i}" data-qid="${i}" ${disabledAttr} placeholder="${placeholderText}" onkeydown="handleEnter(event, ${i})">
                            </div>
                       </td>`;
            }
            html += '</tr></tbody>';

            table.innerHTML = html;
        }

        function renderTables(active) {
            renderTablePart(1, 10, 10, 'gridPart1', active);
            renderTablePart(11, 20, 10, 'gridPart2', active);
        }

        function handleEnter(event, currentQid) {
            if (event.key === 'Enter') {
                event.preventDefault();
                let nextQid = currentQid + 1;
                let nextInput = document.getElementById(`ans-${nextQid}`);
                if (nextInput) {
                    nextInput.focus();
                    nextInput.select();
                } else if (currentQid === 20) {
                    finishTest();
                }
            }
        }

        function startTest() {
            clearInterval(timerInterval);
            timeLeft = 180;
            isTestActive = true;
            document.getElementById('startBtn').disabled = true;
            generateQuestions();
            renderTables(true);
            
            let firstInput = document.getElementById('ans-1');
            if (firstInput) firstInput.focus();
            
            timerInterval = setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    let minutes = String(Math.floor(timeLeft / 60)).padStart(2, '0');
                    let seconds = String(timeLeft % 60).padStart(2, '0');
                    document.getElementById('timerDisplay').innerText = `Sedang mengerjakan ${minutes}:${seconds}`;
                } else {
                    clearInterval(timerInterval);
                    isTestActive = false;
                    checkScoring();
                    document.getElementById('timerDisplay').innerText = "Waktu Habis";
                    document.getElementById('timeUpModal').style.display = 'flex';
                }
            }, 1000);
        }

        function closeModal() {
            document.getElementById('timeUpModal').style.display = 'none';
        }

        function finishTest() {
            if (!isTestActive) return;
            clearInterval(timerInterval);
            isTestActive = false;
            document.getElementById('timerDisplay').innerText = "Selesai";
            checkScoring();
        }

        function checkScoring() {
            let score = 0;
            questions.forEach(q => {
                let inputElem = document.getElementById(`ans-${q.id}`);
                let containerElem = document.getElementById(`container-${q.id}`);
                if (!inputElem || !containerElem) return;
                
                inputElem.disabled = true;
                let rawValue = inputElem.value.trim();
                containerElem.classList.remove('correct-box', 'incorrect-box');

                if (rawValue === "") return;

                if (rawValue === q.exactStr) {
                    score += 10;
                    containerElem.classList.add('correct-box');
                } else {
                    containerElem.classList.add('incorrect-box');
                }
            });
            document.getElementById('finalScore').innerText = score;
        }

        function resetTest() {
            clearInterval(timerInterval);
            isTestActive = false;
            document.getElementById('startBtn').disabled = false;
            document.getElementById('timeUpModal').style.display = 'none';
            document.getElementById('timerDisplay').innerText = "Siap mengerjakan 03:00";
            document.getElementById('finalScore').innerText = "0";
            renderTables(false);
        }

        renderTables(false);
    </script>
</body>
</html>
