<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan IMARIA Nasional 2027 - Kategori F (PS Kali)</title>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Merriweather Sans', sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 12px;
            color: #000;
        }
        .header-container {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            background: #ffffff;
            padding: 10px 18px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 12px;
            border: 1px solid #ccc;
        }
        .title {
            font-weight: bold;
            font-size: 16px;
        }
        .controls button {
            font-family: 'Merriweather Sans', sans-serif;
            padding: 6px 12px;
            margin-right: 5px;
            margin-bottom: 4px;
            border: 1px solid #ccc;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
        }
        .btn-online { background-color: #d4edda; color: #155724; }
        .btn-finish { background-color: #cce5ff; color: #004085; }
        .btn-reset { background-color: #f8d7da; color: #721c24; }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed !important;
        }

        .timer {
            color: #dc3545;
            font-weight: bold;
        }
        .score-box {
            border: 2px solid #000;
            padding: 5px 14px;
            border-radius: 5px;
            font-weight: bold;
            background: #fff;
            font-size: 15px;
        }

        .container-columns {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: space-between;
        }
        .column-section {
            flex: 1;
            min-width: 290px;
            background: #fff;
            border: 1px solid #999;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 12px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
        }
        th, td {
            border: 1px solid #999;
            padding: 7px 6px;
            font-size: 14px;
        }
        th {
            background-color: #e2e2e2;
            font-size: 13px;
            font-weight: bold;
        }
        .col-no {
            width: 38px;
            background-color: #f8f9fa;
            font-size: 13px;
        }
        .col-soal {
            font-style: italic;
            font-weight: 600;
            text-align: center;
            background-color: #fff;
            font-size: 15px;
        }
        .col-jawab {
            width: 95px;
        }
        .ans-input {
            font-family: 'Merriweather Sans', sans-serif;
            width: 85px;
            padding: 4px;
            text-align: center;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 3px;
        }
        .correct { background-color: #d4edda !important; }
        .incorrect { background-color: #f8d7da !important; }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #fff;
            padding: 25px 30px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            width: 260px;
            border: 1px solid #ccc;
        }
        .modal-content h3 {
            margin-top: 0;
            margin-bottom: 20px;
            color: #dc3545;
            font-size: 20px;
        }
        .modal-btn {
            background-color: #004085;
            color: white;
            border: none;
            padding: 8px 25px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Merriweather Sans', sans-serif;
        }
        .modal-btn:hover {
            background-color: #002752;
        }
    </style>
</head>
<body>

    <div class="modal-overlay" id="timeUpModal">
        <div class="modal-content">
            <h3>Waktu Habis</h3>
            <button class="modal-btn" onclick="closeModal()">OK</button>
        </div>
    </div>

    <div class="header-container">
        <div>
            <span class="title">Latihan IMARIA Nasional 2027</span>
            <div style="font-size: 13px; margin-top: 4px;">
                30 Soal masing-masing nilai 5 &nbsp;|&nbsp; 
                <button class="btn-online" id="startBtn" onclick="startTest()">Mulai Mengerjakan</button>
                <button class="btn-finish" id="finishBtn" onclick="finishTest()">Selesai</button>
                <button class="btn-reset" id="resetBtn" onclick="resetTest()">Atur Ulang</button>
                <span class="timer" id="timerDisplay">Siap mengerjakan 03:00</span>
            </div>
        </div>
        <div>
            <span style="font-weight: bold; font-size: 15px;">Kategori F - PS Kali</span>
            <div style="font-size: 12px; margin-top: 3px;">Batas waktu: 3 menit</div>
        </div>
        <div class="score-box">
            NILAI <span id="finalScore">0</span>
        </div>
    </div>

    <div class="container-columns">
        <div class="column-section">
            <table id="tableCol1"></table>
        </div>
        <div class="column-section">
            <table id="tableCol2"></table>
        </div>
        <div class="column-section">
            <table id="tableCol3"></table>
        </div>
    </div>

    <script>
        let questions = [];
        let timerInterval;
        let timeLeft = 180;
        let isTestActive = false;

        function generateRandomQuestions() {
            while (true) {
                let counts = {};
                for (let i = 0; i <= 9; i++) counts[i] = 15;

                let nonZeroPool = [];
                for (let i = 1; i <= 9; i++) {
                    for (let c = 0; c < counts[i]; c++) {
                        nonZeroPool.push(i);
                    }
                }
                nonZeroPool.sort(() => Math.random() - 0.5);

                if (nonZeroPool.length < 60) continue;
                let leadingDigits = nonZeroPool.slice(0, 60);
                
                leadingDigits.forEach(d => counts[d]--);

                let restPool = [];
                for (let i = 0; i <= 9; i++) {
                    for (let c = 0; c < counts[i]; c++) {
                        restPool.push(i);
                    }
                }
                restPool.sort(() => Math.random() - 0.5);

                let leadIdx = 0;
                let restIdx = 0;
                let num1s = [];
                let num2s = [];
                let valid = true;

                for (let i = 0; i < 30; i++) {
                    let num1, num2;
                    let t1, u1, t2, u2;

                    if (i % 2 === 0) {
                        let h1 = leadingDigits[leadIdx++];
                        t1 = restPool[restIdx++];
                        u1 = restPool[restIdx++];
                        num1 = h1 * 100 + t1 * 10 + u1;

                        let t_2 = leadingDigits[leadIdx++];
                        u2 = restPool[restIdx++];
                        num2 = t_2 * 10 + u2;
                        
                        if (t1 === 0 && u1 === 0) { valid = false; break; }
                    } else {
                        let t_1 = leadingDigits[leadIdx++];
                        u1 = restPool[restIdx++];
                        num1 = t_1 * 10 + u1;

                        let h2 = leadingDigits[leadIdx++];
                        t2 = restPool[restIdx++];
                        u2 = restPool[restIdx++];
                        num2 = h2 * 100 + t2 * 10 + u2;

                        if (t2 === 0 && u2 === 0) { valid = false; break; }
                    }

                    if (num1 % 10 === 0 && num2 % 10 === 0) {
                        valid = false;
                        break;
                    }

                    if (num1 === 10 || num1 === 11 || num2 === 10 || num2 === 11) {
                        valid = false;
                        break;
                    }

                    num1s.push(num1);
                    num2s.push(num2);
                }

                if (!valid) continue;

                let checkFreq = {};
                for (let i = 0; i <= 9; i++) checkFreq[i] = 0;
                num1s.forEach(n => {
                    String(n).split('').forEach(ch => checkFreq[Number(ch)]++);
                });
                num2s.forEach(n => {
                    String(n).split('').forEach(ch => checkFreq[Number(ch)]++);
                });

                let isPerfect = true;
                for (let i = 0; i <= 9; i++) {
                    if (checkFreq[i] !== 15) isPerfect = false;
                }

                if (!isPerfect) continue;

                questions = [];
                for (let i = 0; i < 30; i++) {
                    let num1 = num1s[i];
                    let num2 = num2s[i];
                    let answer = num1 * num2;
                    let formattedAnswer = answer.toLocaleString('id-ID');

                    questions.push({
                        id: i + 1,
                        num1: num1,
                        num2: num2,
                        display: num1 + " × " + num2,
                        answer: answer,
                        formattedAnswer: formattedAnswer
                    });
                }
                break;
            }
        }

        function renderColumn(start, end, elementId, active) {
            let table = document.getElementById(elementId);
            if (!table) return;
            
            let html = '<thead><tr><th class="col-no">No</th><th>Soal</th><th class="col-jawab">Jawaban</th></tr></thead><tbody>';
            
            for (let i = start; i <= end; i++) {
                let qIndex = i - 1;
                let qDisplay = (active && questions[qIndex]) ? questions[qIndex].display : '';
                let disabledAttr = active ? '' : 'disabled';
                let placeholderText = active ? '' : '-';

                html += '<tr>' +
                    '<td class="col-no">' + i + '</td>' +
                    '<td class="col-soal">' + qDisplay + '</td>' +
                    '<td class="col-jawab"><input type="text" inputmode="numeric" class="ans-input" id="ans-' + i + '" data-qid="' + i + '" ' + disabledAttr + ' placeholder="' + placeholderText + '" onkeydown="handleEnter(event, ' + i + ')"></td>' +
                    '</tr>';
            }
            
            html += '</tbody>';
            table.innerHTML = html;
        }

        function renderAllColumns(active) {
            renderColumn(1, 10, 'tableCol1', active);
            renderColumn(11, 20, 'tableCol2', active);
            renderColumn(21, 30, 'tableCol3', active);
        }

        function handleEnter(event, currentQid) {
            if (event.key === 'Enter') {
                event.preventDefault();
                let nextQid = currentQid + 1;
                let nextInput = document.getElementById('ans-' + nextQid);
                if (nextInput) {
                    nextInput.focus();
                    nextInput.select();
                } else if (currentQid === 30) {
                    finishTest();
                }
            }
        }

        function startTest() {
            clearInterval(timerInterval);
            timeLeft = 180;
            isTestActive = true;
            
            // Nonaktifkan tombol "Mulai Mengerjakan" agar tidak bisa diklik lagi
            document.getElementById('startBtn').disabled = true;
            
            generateRandomQuestions();
            renderAllColumns(true);
            
            let firstInput = document.getElementById('ans-1');
            if (firstInput) firstInput.focus();
            
            timerInterval = setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    let minutes = String(Math.floor(timeLeft / 60)).padStart(2, '0');
                    let seconds = String(timeLeft % 60).padStart(2, '0');
                    document.getElementById('timerDisplay').innerText = "Sedang mengerjakan " + minutes + ":" + seconds;
                } else {
                    clearInterval(timerInterval);
                    isTestActive = false;
                    checkScoring();
                    document.getElementById('timerDisplay').innerText = "Waktu Habis";
                    document.getElementById('timeUpModal').style.display = 'flex';
                }
            }, 1000);
        }

        function closeModal() {
            document.getElementById('timeUpModal').style.display = 'none';
        }

        function finishTest() {
            if (!isTestActive) return;
            clearInterval(timerInterval);
            isTestActive = false;
            document.getElementById('timerDisplay').innerText = "Selesai";
            checkScoring();
        }

        function checkScoring() {
            let score = 0;
            questions.forEach(q => {
                let inputElem = document.getElementById('ans-' + q.id);
                if (!inputElem) return;
                
                inputElem.disabled = true;
                let rawValue = inputElem.value.trim();
                inputElem.classList.remove('correct', 'incorrect');

                if (rawValue === "") return;

                if (rawValue === q.formattedAnswer) {
                    score += 5;
                    inputElem.classList.add('correct');
                } else {
                    inputElem.classList.add('incorrect');
                }
            });
            document.getElementById('finalScore').innerText = score;
        }

        window.question_reset = resetTest; // placeholder if needed

        function resetTest() {
            clearInterval(timerInterval);
            isTestActive = false;
            
            // Aktifkan kembali tombol "Mulai Mengerjakan" saat di-reset
            document.getElementById('startBtn').disabled = false;

            document.getElementById('timeUpModal').style.display = 'none';
            document.getElementById('timerDisplay').innerText = "Siap mengerjakan 03:00";
            document.getElementById('finalScore').innerText = "0";
            
            generateRandomQuestions();
            renderAllColumns(false);
        }

        generateRandomQuestions();
        renderAllColumns(false);
    </script>
</body>
</html>
