<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan IMARIA Nasional 2027</title>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Merriweather Sans', sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            color: #000;
        }
        .header-container {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            background: #ffffff;
            padding: 10px 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 15px;
            border: 1px solid #ccc;
        }
        .title {
            font-weight: bold;
            font-size: 16px;
        }
        .controls button {
            font-family: 'Merriweather Sans', sans-serif;
            padding: 6px 12px;
            margin-right: 5px;
            margin-bottom: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-online { background-color: #d4edda; color: #155724; }
        .btn-finish { background-color: #cce5ff; color: #004085; }
        .btn-reset { background-color: #f8d7da; color: #721c24; }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed !important;
        }

        .timer {
            color: #dc3545;
            font-weight: bold;
        }
        .score-box {
            border: 2px solid #000;
            padding: 5px 15px;
            border-radius: 5px;
            font-weight: bold;
            background: #fff;
        }

        .table-section {
            background: #fff;
            margin-bottom: 15px;
            border: 1px solid #999;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            table-layout: fixed;
        }
        th, td {
            border: 1px solid #999;
            padding: 3px;
            font-size: 14px;
        }
        th.col-no, td.col-no {
            width: 45px;
            min-width: 45px;
            max-width: 45px;
        }
        th {
            background-color: #e2e2e2;
            font-size: 11px;
            font-style: italic;
            font-weight: normal;
        }
        .ans-input {
            font-family: 'Merriweather Sans', sans-serif;
            width: 80%;
            padding: 2px;
            text-align: center;
            font-size: 13px;
            border: 1px solid #ccc;
            border-radius: 3px;
        }
        .number-row td:not(.col-no) {
            font-family: 'Merriweather Sans', sans-serif;
            font-size: 13px;
            font-weight: 600;
            font-style: italic; 
            height: 22px;
            text-align: right;
            padding-right: 15px; 
        }
        .correct { background-color: #d4edda !important; }
        .incorrect { background-color: #f8d7da !important; }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #fff;
            padding: 25px 30px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            width: 260px;
            border: 1px solid #ccc;
        }
        .modal-content h3 {
            margin-top: 0;
            margin-bottom: 20px;
            color: #dc3545;
            font-size: 20px;
        }
        .modal-btn {
            background-color: #004085;
            color: white;
            border: none;
            padding: 8px 25px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Merriweather Sans', sans-serif;
        }
        .modal-btn:hover {
            background-color: #002752;
        }
    </style>
</head>
<body>

    <div class="modal-overlay" id="timeUpModal">
        <div class="modal-content">
            <h3>Waktu Habis</h3>
            <button class="modal-btn" onclick="closeModal()">OK</button>
        </div>
    </div>

    <div class="header-container">
        <div>
            <span class="title">Latihan IMARIA Nasional 2027</span>
            <div style="font-size: 13px; margin-top: 5px;">
                30 Soal masing-masing nilai 10 &nbsp;|&nbsp; 
                <button class="btn-online" id="startBtn" onclick="startTest()">Mulai Mengerjakan</button>
                <button class="btn-finish" onclick="finishTest()">Selesai</button>
                <button class="btn-reset" onclick="resetTest()">Atur Ulang</button>
                <span class="timer" id="timerDisplay">Siap mengerjakan 01:00</span>
            </div>
        </div>
        <div>
            <span style="font-weight: bold; font-size: 15px;">Kategori A - Ekstra</span>
            <div style="font-size: 12px; margin-top: 4px;">Batas waktu: 1 menit</div>
        </div>
        <div class="score-box">
            NILAI <span id="finalScore">0</span>
        </div>
    </div>

    <div class="table-section">
        <table id="gridPart1"></table>
    </div>

    <div class="table-section">
        <table id="gridPart2"></table>
    </div>

    <div class="table-section">
        <table id="gridPart3"></table>
    </div>

    <script>
        let questions = [];
        let timerInterval;
        let timeLeft = 60;
        let isTestActive = false;

        function generateQuestions() {
            questions = [];
            window.doubleFiveTarget = null;
            let generatedSignatures1To5 = new Set();
        
            for (let i = 1; i <= 30; i++) {
                let rowCount = 5; 
                if (i >= 11 && i <= 20) rowCount = 7; 
                else if (i >= 21) rowCount = 10; 

                let validQuestion = false;
                let numbersList = [];
                let currentTotal = 0;

                while (!validQuestion) {
                    numbersList = [];
                    let tempTotal = 0;
                    let rawValues = [];
                    let signsList = [];
                    let isPureDirect = true;

                    if (i >= 1 && i <= 5) {
                        let duplicatedNum;
                        if (i === 1) duplicatedNum = 2;
                        else if (i === 2) duplicatedNum = 3;
                        else if (i === 3) duplicatedNum = 1;
                        else if (i === 4) duplicatedNum = 4;
                        else duplicatedNum = Math.floor(Math.random() * 4) + 1;

                        let pool = [duplicatedNum, duplicatedNum];
                        let available = [1, 2, 3, 4].filter(n => n !== duplicatedNum);
                        for (let k = 0; k < 3; k++) {
                            let idx = Math.floor(Math.random() * available.length);
                            pool.push(available[idx]);
                            available.splice(idx, 1);
                        }
                        pool.sort(() => Math.random() - 0.5);
                        rawValues = pool;

                        let minusIndices = [];
                        while (minusIndices.length < 2) {
                            let rIdx = Math.floor(Math.random() * 4) + 1;
                            if (!minusIndices.includes(rIdx)) {
                                minusIndices.push(rIdx);
                            }
                        }

                        for (let r = 0; r < rowCount; r++) {
                            let baseVal = rawValues[r];
                            let isMinus = minusIndices.includes(r);
                            signsList.push(isMinus ? '-' : '+');

                            if (isMinus) {
                                if (tempTotal - baseVal < 0) {
                                    tempTotal += baseVal;
                                    signsList[r] = '+';
                                    numbersList.push({ display: `${baseVal}`, val: baseVal });
                                } else {
                                    tempTotal -= baseVal;
                                    numbersList.push({ display: `- ${baseVal}`, val: -baseVal });
                                }
                            } else {
                                let nextTotal = tempTotal + baseVal;
                                if (nextTotal > 4) {
                                    isPureDirect = false;
                                }
                                tempTotal = nextTotal;
                                numbersList.push({ display: `${baseVal}`, val: baseVal });
                            }
                        }

                        let signature = numbersList.map((n, idx) => `${signsList[idx]}${Math.abs(n.val)}`).join(',');
                        let minusCount = signsList.filter(s => s === '-').length;

                        if (tempTotal > 0 && isPureDirect && minusCount === 2 && !generatedSignatures1To5.has(signature)) {
                            generatedSignatures1To5.add(signature);
                            currentTotal = tempTotal;
                            validQuestion = true;
                        }

                    } else if (i >= 6 && i <= 10) {
                        if (!window.doubleFiveTarget) {
                            window.doubleFiveTarget = Math.floor(Math.random() * 5) + 6;
                        }

                        let pool = [];
                        if (i === window.doubleFiveTarget) {
                            let removedNum = Math.floor(Math.random() * 4) + 1;
                            pool = [1, 2, 3, 4, 5].filter(n => n !== removedNum);
                            pool.push(5);
                        } else {
                            pool = [1, 2, 3, 4, 5];
                        }

                        pool.sort(() => Math.random() - 0.5);
                        rawValues = pool;

                        let minusIndices = [];
                        while (minusIndices.length < 2) {
                            let rIdx = Math.floor(Math.random() * 4) + 1;
                            if (!minusIndices.includes(rIdx)) {
                                minusIndices.push(rIdx);
                            }
                        }

                        let isValid = true;
                        tempTotal = 0;

                        for (let r = 0; r < rowCount; r++) {
                            let baseVal = rawValues[r];
                            let isMinus = minusIndices.includes(r);

                            if (isMinus) {
                                let lowerBeads = tempTotal % 5;
                                let hasUpperBead = tempTotal >= 5;

                                let canSubtractDirect = false;
                                if (baseVal === 5 && hasUpperBead) {
                                    canSubtractDirect = true;
                                } else if (baseVal < 5 && lowerBeads >= baseVal) {
                                    canSubtractDirect = true;
                                }

                                if (canSubtractDirect && (tempTotal - baseVal >= 0)) {
                                    tempTotal -= baseVal;
                                    signsList.push('-');
                                    numbersList.push({ display: `- ${baseVal}`, val: -baseVal });
                                } else {
                                    isValid = false;
                                    break;
                                }
                            } else {
                                let lowerBeads = tempTotal % 5;
                                let hasUpperBead = tempTotal >= 5;

                                let canAddDirect = false;
                                if (baseVal === 5 && !hasUpperBead) {
                                    canAddDirect = true;
                                } else if (baseVal < 5 && (4 - lowerBeads) >= baseVal) {
                                    canAddDirect = true;
                                }

                                if (canAddDirect && (tempTotal + baseVal <= 9)) {
                                    tempTotal += baseVal;
                                    signsList.push('+');
                                    numbersList.push({ display: `${baseVal}`, val: baseVal });
                                } else {
                                    isValid = false;
                                    break;
                                }
                            }
                        }

                        if (isValid && tempTotal >= 0 && tempTotal <= 9) {
                            currentTotal = tempTotal;
                            validQuestion = true;
                        }

                    } else if (i >= 11 && i <= 20) {
                        tempTotal = 0;
                        numbersList = [];
                        signsList = [];
                        
                        let availableDigits = [1, 2, 3, 4, 5, 6, 7, 8, 9];
                        let minusIndices = [];
                        while (minusIndices.length < 2) {
                            let rIdx = Math.floor(Math.random() * 6) + 1;
                            if (!minusIndices.includes(rIdx)) {
                                minusIndices.push(rIdx);
                            }
                        }

                        let isValidSequence = true;

                        for (let r = 0; r < rowCount; r++) {
                            let isMinus = minusIndices.includes(r);
                            let lowerBeads = tempTotal % 5;
                            let hasUpperBead = tempTotal >= 5;

                            let validCandidates = availableDigits.filter(baseVal => {
                                if (isMinus) {
                                    let canSubtractDirect = false;
                                    if (baseVal === 5 && hasUpperBead) canSubtractDirect = true;
                                    else if (baseVal < 5 && lowerBeads >= baseVal) canSubtractDirect = true;
                                    else if (baseVal > 5 && hasUpperBead && (lowerBeads >= (baseVal - 5))) canSubtractDirect = true;
                                    
                                    return canSubtractDirect && (tempTotal - baseVal >= 0);
                                } else {
                                    let canAddDirect = false;
                                    if (baseVal === 5 && !hasUpperBead) canAddDirect = true;
                                    else if (baseVal < 5 && (4 - lowerBeads) >= baseVal) canAddDirect = true;
                                    else if (baseVal > 5 && !hasUpperBead && ((4 - lowerBeads) >= (baseVal - 5))) canAddDirect = true;

                                    return canAddDirect && (tempTotal + baseVal <= 9);
                                }
                            });

                            if (validCandidates.length === 0) {
                                isValidSequence = false;
                                break;
                            }

                            let chosenIdx = Math.floor(Math.random() * validCandidates.length);
                            let chosenVal = validCandidates[chosenIdx];
                            availableDigits = availableDigits.filter(d => d !== chosenVal);

                            if (isMinus) {
                                tempTotal -= chosenVal;
                                signsList.push('-');
                                numbersList.push({ display: `- ${chosenVal}`, val: -chosenVal });
                            } else {
                                tempTotal += chosenVal;
                                signsList.push('+');
                                numbersList.push({ display: `${chosenVal}`, val: chosenVal });
                            }
                        }

                        if (isValidSequence && tempTotal >= 0 && tempTotal <= 9) {
                            currentTotal = tempTotal;
                            validQuestion = true;
                        }

                    } else if (i >= 21 && i <= 30) {
                        tempTotal = 0;
                        numbersList = [];
                        signsList = [];
                        let isValid = true;

                        let pool = [1, 2, 3, 4, 5, 6, 7, 8, 9];
                        let duplicateDigit = Math.floor(Math.random() * 9) + 1;
                        pool.push(duplicateDigit);

                        let selectedDigits = [...pool].sort(() => Math.random() - 0.5);

                        let minusIndices = [];
                        let targetMinusNumbers = [22, 24, 27, 29];

                        if (targetMinusNumbers.includes(i)) {
                            while (minusIndices.length < 3) {
                                let rIdx = Math.floor(Math.random() * 9) + 1;
                                if (!minusIndices.includes(rIdx)) {
                                    minusIndices.push(rIdx);
                                }
                            }
                        }

                        for (let r = 0; r < rowCount; r++) {
                            let baseVal = selectedDigits[r];
                            let isMinus = minusIndices.includes(r);

                            if (isMinus) {
                                if (tempTotal - baseVal >= 0) {
                                    tempTotal -= baseVal;
                                    signsList.push('-');
                                    numbersList.push({ display: `- ${baseVal}`, val: -baseVal });
                                } else {
                                    isValid = false;
                                    break;
                                }
                            } else {
                                tempTotal += baseVal;
                                signsList.push('+');
                                numbersList.push({ display: `${baseVal}`, val: baseVal });
                            }
                        }

                        if (isValid && tempTotal >= 0) {
                            currentTotal = tempTotal;
                            validQuestion = true;
                        }
                    }
                }

                questions.push({
                    id: i,
                    rowCount: rowCount,
                    rows: numbersList,
                    answer: currentTotal
                });
            }
        }

        function renderTablePart(start, end, rowCount, elementId, active) {
            let table = document.getElementById(elementId);
            let html = '<thead><tr><th class="col-no">NO</th>';
            
            for (let i = start; i <= end; i++) {
                html += `<th>${i}</th>`;
            }
            html += '</tr></thead><tbody>';

            for (let r = 0; r < rowCount; r++) {
                html += `<tr class="number-row"><td class="col-no" style="text-align: center; padding-right: 0; font-weight: normal; font-style: normal; font-size: 11px; background-color: #f8f9fa;">${r+1}</td>`;
                for (let i = start - 1; i < end; i++) {
                    let val = (active && questions[i] && questions[i].rows[r]) ? questions[i].rows[r].display : '';
                    html += `<td>${val}</td>`;
                }
                html += '</tr>';
            }

            html += '<tr><td class="col-no" style="text-align: center; font-weight: bold; font-size: 11px; font-style: normal; background-color: #f8f9fa;">Jawaban</td>';
            for (let i = start; i <= end; i++) {
                let disabledAttr = active ? '' : 'disabled';
                let placeholderText = active ? '' : '-';
                html += `<td><input type="text" inputmode="numeric" class="ans-input" id="ans-${i}" data-qid="${i}" ${disabledAttr} placeholder="${placeholderText}" onkeydown="handleEnter(event, ${i})"></td>`;
            }
            html += '</tr></tbody>';

            table.innerHTML = html;
        }

        function renderTables(active) {
            renderTablePart(1, 10, 5, 'gridPart1', active);
            renderTablePart(11, 20, 7, 'gridPart2', active);
            renderTablePart(21, 30, 10, 'gridPart3', active);
        }

        function handleEnter(event, currentQid) {
            if (!isTestActive) return;
            if (event.key === 'Enter') {
                event.preventDefault();
                let nextQid = currentQid + 1;
                let nextInput = document.getElementById(`ans-${nextQid}`);
                if (nextInput) {
                    nextInput.focus();
                    nextInput.select();
                } else if (currentQid === 30) {
                    finishTest();
                }
            }
        }

        function startTest() {
            clearInterval(timerInterval);
            timeLeft = 60;
            isTestActive = true;
            
            document.getElementById('startBtn').disabled = true;

            generateQuestions();
            renderTables(true);
            
            let firstInput = document.getElementById('ans-1');
            if (firstInput) firstInput.focus();
            
            timerInterval = setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    let minutes = String(Math.floor(timeLeft / 60)).padStart(2, '0');
                    let seconds = String(timeLeft % 60).padStart(2, '0');
                    document.getElementById('timerDisplay').innerText = `Sedang mengerjakan ${minutes}:${seconds}`;
                } else {
                    clearInterval(timerInterval);
                    isTestActive = false;
                    
                    checkScoring();
                    document.getElementById('timerDisplay').innerText = "Waktu Habis";
                    document.getElementById('timeUpModal').style.display = 'flex';
                }
            }, 1000);
        }

        function closeModal() {
            document.getElementById('timeUpModal').style.display = 'none';
        }

        function finishTest() {
            if (!isTestActive) return;
            clearInterval(timerInterval);
            isTestActive = false;
            document.getElementById('timerDisplay').innerText = "Selesai";
            checkScoring();
        }

        function checkScoring() {
            let score = 0;
            questions.forEach(q => {
                let inputElem = document.getElementById(`ans-${q.id}`);
                if (!inputElem) return;
                
                inputElem.disabled = true;

                let rawValue = inputElem.value.trim();
                
                inputElem.classList.remove('correct', 'incorrect');

                if (rawValue === "") {
                    return;
                }

                // Tolak jika mengandung titik, koma, atau karakter non-digit lainnya
                if (rawValue.includes('.') || rawValue.includes(',') || rawValue.includes('-')) {
                    inputElem.classList.add('incorrect');
                    return;
                }

                // Regex ketat: hanya angka murni tanpa awalan 0 yang tidak perlu (kecuali angka '0' itu sendiri)
                let isValidFormat = /^(0|[1-9]\d*)$/.test(rawValue);
                let userVal = Number(rawValue);
                
                if (isValidFormat && userVal === q.answer) {
                    score += 10;
                    inputElem.classList.add('correct');
                } else {
                    inputElem.classList.add('incorrect');
                }
            });
            document.getElementById('finalScore').innerText = score;
        }

        function resetTest() {
            clearInterval(timerInterval);
            isTestActive = false;
            
            document.getElementById('startBtn').disabled = false;

            document.getElementById('timeUpModal').style.display = 'none';
            document.getElementById('timerDisplay').innerText = "Siap mengerjakan 01:00";
            document.getElementById('finalScore').innerText = "0";
            renderTables(false);
        }

        resetTest();
    </script>
</body>
</html>
